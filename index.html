<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio | Miles G. Yulo</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Tailwind CSS Shortcuts -->
    <style type="text/tailwindcss">
        @custom-variant dark (&:where(.dark, .dark *));

        @layer components {
            .btn-primary {
                @apply rounded-xl bg-red-800 px-6 py-3 font-semibold text-white shadow-md transition-all duration-300 hover:-translate-y-1 hover:bg-yellow-400 hover:text-red-950 dark:bg-orange-500 dark:text-white dark:hover:bg-yellow-400;
            }

            .card {
                @apply rounded-2xl border border-yellow-500 bg-yellow-300 p-8 text-red-950 shadow-[6px_6px_14px_rgba(80,0,0,0.18),-6px_-6px_14px_rgba(255,255,255,0.15)] transition-all duration-300 hover:-translate-y-1 dark:border-slate-700 dark:bg-slate-800 dark:text-white;
            }

            .title {
                @apply mb-4 text-2xl font-bold text-red-800 dark:text-orange-400;
            }

            .nav-link {
                @apply rounded-lg px-4 py-2 font-semibold text-red-950 transition-colors hover:bg-red-800 hover:text-white dark:text-white dark:hover:bg-orange-500;
            }

            .input-field {
                @apply w-full rounded-xl border-2 border-yellow-500 bg-white p-3 text-slate-900 shadow-inner outline-none focus:border-red-600 focus:ring-2 focus:ring-yellow-300;
            }

            .service-card {
                @apply rounded-xl border border-yellow-500 bg-yellow-100 p-5 text-red-950 shadow-[4px_4px_8px_rgba(80,0,0,0.12)] transition-all duration-300 hover:-translate-y-1 hover:shadow-lg dark:border-slate-600 dark:bg-slate-700 dark:text-white;
            }
        }
    </style>
</head>

<body class="min-h-screen bg-red-700 text-white transition-colors duration-300 dark:bg-slate-900">

    <!-- HERO SECTION -->
    <section id="hero" class="bg-red-700 px-6 py-16 text-center dark:bg-slate-900">

    

        <h1 class="text-4xl font-bold tracking-tight text-white sm:text-5xl">
            Miles G. Yulo
        </h1>

        <p class="mx-auto mt-4 max-w-2xl leading-7 text-white">
            Welcome to my personal portfolio!
        </p>

        <div class="mt-7 flex flex-wrap justify-center gap-4">

        </div>

        <button
            id="toggledark"
            type="button"
            class="mt-6 rounded-xl border border-white/40 px-5 py-2 font-semibold text-white transition-colors hover:bg-yellow-400 hover:text-red-950">
            Toggle
        </button>

    </section>

    <!-- NAVIGATION -->
    <header class="border-y-2 border-white bg-yellow-400 px-6 py-5 dark:border-slate-700 dark:bg-slate-800">

        <nav class="mx-auto flex max-w-6xl flex-wrap items-center justify-center gap-3">

            <a href="#hero" class="nav-link">Hero</a>
            <a href="#about" class="nav-link">About</a>
            <a href="#services" class="nav-link">Services</a>
            <a href="#contact" class="nav-link">Contact</a>

        </nav>

    </header>

    <!-- MAIN CONTENT -->
    <main class="mx-auto flex max-w-6xl flex-col gap-8 px-5 py-10">

        

        <!-- SERVICES SECTION -->
        <section id="services" class="card">

            <p class="mb-2 text-sm font-bold uppercase tracking-widest text-red-700">
                What I can do
            </p>

            <h2 class="title">
                My Services
            </h2>


        </section>

        <!-- CONTACT SECTION -->
        <section id="contact" class="card">

            <p class="mb-2 text-sm font-bold uppercase tracking-widest text-red-700">
                Get in touch
            </p>

            <h2 class="title">
                Let's Build Together!
            </h2>

            <p class="mb-6 leading-7">
                Have a question or project idea? Send me a message.
            </p>

            <form action="#" method="post" class="flex flex-col gap-3">

                <label for="name" class="font-semibold">
                    Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    class="input-field"
                    required>

                <label for="email" class="font-semibold">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    class="input-field"
                    required>

                <label for="message" class="font-semibold">
                    Message
                </label>

                <textarea
                    id="message"
                    name="message"
                    rows="5"
                    placeholder="Write your message"
                    class="input-field"
                    required></textarea>

                <button type="submit" class="btn-primary mt-3">
                    Send Message
                </button>

            </form>

        </section>

    </main>

    <!-- FOOTER -->
    <footer class="border-t-2 border-white bg-yellow-400 px-6 py-8 text-center text-red-950 dark:border-slate-700 dark:bg-slate-950 dark:text-white">

        <p class="font-bold">
            Miles G. Yulo
        </p>

        <a href="mailto:c20245418.yulo@csav.edu.ph"
           class="mt-2 inline-block underline underline-offset-4">
            c20245418.yulo@csav.edu.ph
        </a>

        <p class="mt-3 text-sm">
            &copy; 2026 Miles G. Yulo. All rights reserved.
        </p>

    </footer>

    <!-- DARK MODE TOGGLE -->
    <script>
        const toggleButton = document.querySelector("#toggledark");
        const html = document.documentElement;

        toggleButton.addEventListener("click", function () {
            html.classList.toggle("dark");
        });
    </script>

</body>
</html>
